version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /api
      - /mailserver/daemon
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns:
          - golang.org/x/*

  - package-ecosystem: npm
    directories:
      - /app
      - /wxt
    schedule:
      interval: weekly
    ignore:
      # Tailwind v4 is a breaking migration (CSS-based config, preline v2
      # plugin incompatible, preflight changes); stay on v3 until planned.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  # Base images in the Dockerfiles are pinned by tag + digest; this keeps the
  # digests from going stale.
  - package-ecosystem: docker
    directories:
      - /api
      - /app
      - /mailserver/daemon
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories:
      - /api
      - /mailserver
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
