name: CI Staging

on:
  push:
    branches:
      - staging

env:
  API_IMAGE: email/api
  APP_IMAGE: email/app
  TAG: staging
  GIT_SHA: ${GITHUB_SHA::7}
  REGISTRY: ${{ secrets.REGISTRY_NAME }}

jobs:
  deploy_staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      
      - name: Set up sparse checkout
        run: |
          git sparse-checkout init --cone
          git sparse-checkout set api

      - name: Pull changes from PR branch
        run: git pull origin ${{ github.event.pull_request.head.ref }}
      
      - name: Build $API_IMAGE
        run: docker build -t $REGISTRY/$API_IMAGE:$GIT_SHA api/.

      - name: Tag $API_IMAGE
        run: docker tag $REGISTRY/$API_IMAGE:$GIT_SHA $REGISTRY/$API_IMAGE:$TAG

      - name: Build $APP_IMAGE
        run: docker build -t $REGISTRY/$APP_IMAGE:$GIT_SHA app/.

      - name: Tag $APP_IMAGE
        run: docker tag $REGISTRY/$APP_IMAGE:$GIT_SHA $REGISTRY/$APP_IMAGE:$TAG

      - name: Push $API_IMAGE:$GIT_SHA
        run: docker push $REGISTRY/$API_IMAGE:$GIT_SHA

      - name: Push $API_IMAGE:$TAG
        run: docker push $REGISTRY/$API_IMAGE:$TAG
    
      - name: Push $APP_IMAGE:$GIT_SHA
        run: docker push $REGISTRY/$APP_IMAGE:$GIT_SHA

      - name: Push $APP_IMAGE:$TAG
        run: docker push $REGISTRY/$APP_IMAGE:$TAG
