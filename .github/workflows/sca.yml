name: Dependency vulnerability scan
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly, so new advisories against unchanged code are caught too.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [api, mailserver/daemon]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      # Scan with the exact toolchain the production image is built with, so
      # stdlib findings match what ships.
      - name: Read Go version from Dockerfile
        id: go
        env:
          DIR: ${{ matrix.dir }}
        run: |
          version=$(grep -oP '^FROM golang:\K[0-9.]+' "$DIR/Dockerfile")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false
      - name: govulncheck
        working-directory: ${{ matrix.dir }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: false
      - name: osv-scanner
        run: >-
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0 scan source
          --config .github/osv-scanner.toml
          -L api/go.mod
          -L mailserver/daemon/go.mod
          -L app/yarn.lock
          -L wxt/yarn.lock
