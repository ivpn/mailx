name: email

services:
  api:
    build: .
    container_name: email-api
    image: email-api
    restart: always
    ports:
      - ${API_PORT}:${API_PORT}
    volumes:
      - api:/var/log
    networks:
      net:
        ipv4_address: ${API_CONTAINER_IP}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Ensures access to the host's IP

  app:
    build: ../app
    container_name: email-app
    image: email-app
    restart: always
    ports:
      - ${APP_PORT}:${APP_PORT}
    networks:
      net:

volumes:
  api:

networks:
  net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}
