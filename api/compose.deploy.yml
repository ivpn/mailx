name: email

services:
  api:
    build: .
    container_name: email-api
    image: email-api
    restart: unless-stopped
    ports:
      - 127.0.0.1:${API_PORT}:${API_PORT}
    volumes:
      - api:/var/log
    networks:
      net:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    build: ../app
    container_name: email-app
    image: email-app
    restart: unless-stopped
    ports:
      - 127.0.0.1:${APP_PORT}:${APP_PORT}
    networks:
      net:

volumes:
  api:

networks:
  net:
    driver: bridge
    ipam:
     config:
       - subnet: ${NET_SUBNET}
         gateway: ${NET_GATEWAY}
