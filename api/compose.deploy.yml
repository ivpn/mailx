name: email

services:
  api:
    build: .
    container_name: email-api
    image: email-api
    restart: always
    ports:
      - ${API_PORT}:${API_PORT}
    volumes:
      - api:/var/log
    network_mode: host

  app:
    build: ../app
    container_name: email-app
    image: email-app
    restart: always
    ports:
      - ${APP_PORT}:${APP_PORT}
    network_mode: host

volumes:
  api:

networks:
  net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}
