name: email

services:
  api:
    build: .
    container_name: email-api
    image: email-api
    restart: always
    ports:
      - ${API_PORT}:${API_PORT}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - email-api:/var/log
    networks:
      email:
  
  app:
    build: ../app
    container_name: email-app
    image: email-app
    restart: always
    ports:
      - ${APP_PORT}:${APP_PORT}

  db:
    image: mariadb
    container_name: email-db
    restart: always
    healthcheck:
      test: "/usr/bin/mariadb --user=email --password=email --execute \"SHOW DATABASES;\""
      interval: 2s
      timeout: 10s
      retries: 5
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - email-db:/var/lib/mysql
    labels:
      - docker-volume-backup.stop-during-backup=db
    networks:
      email:
  
  redis:
    image: redis
    container_name: email-redis
    restart: always
    volumes:
      - email-redis:/data
    networks:
      email:
  
  backup:
    image: offen/docker-volume-backup:v2
    container_name: backup
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      BACKUP_FILENAME: "backup-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_CRON_EXPRESSION: ${BACKUP_CRON_EXPRESSION}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      GPG_PASSPHRASE: ${GPG_PASSPHRASE}
      BACKUP_STOP_DURING_BACKUP_LABEL: db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - email-db:/backup/email-db:ro
      - ${HOME}/backups:/archive

volumes:
  email-api:
  email-db:
  email-redis:

networks:
  email:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}
