definitions:
  api.AccessKeyReq:
    properties:
      expires_at:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  api.ActivateReq:
    properties:
      otp:
        type: string
    required:
    - otp
    type: object
  api.AliasPinReq:
    properties:
      pinned:
        type: boolean
    type: object
  api.AliasReq:
    properties:
      description:
        type: string
      domain:
        type: string
      enabled:
        type: boolean
      format:
        type: string
      from_name:
        type: string
      local_part:
        type: string
      recipients:
        type: string
      wildcard_delimiter:
        enum:
        - +
        - .
        type: string
      wildcard_local_part:
        maxLength: 12
        minLength: 6
        type: string
    required:
    - domain
    - recipients
    type: object
  api.Announcement:
    properties:
      body:
        type: string
      link:
        type: string
      title:
        type: string
    type: object
  api.AuthReq:
    properties:
      access_key:
        maxLength: 85
        minLength: 85
        type: string
    required:
    - access_key
    type: object
  api.BulkAliasEnabledReq:
    properties:
      enabled:
        type: boolean
      ids:
        items:
          type: string
        maxItems: 500
        minItems: 1
        type: array
    required:
    - ids
    type: object
  api.BulkAliasIDsReq:
    properties:
      ids:
        items:
          type: string
        maxItems: 500
        minItems: 1
        type: array
    required:
    - ids
    type: object
  api.BulkAliasPinReq:
    properties:
      ids:
        items:
          type: string
        maxItems: 500
        minItems: 1
        type: array
      pinned:
        type: boolean
    required:
    - ids
    type: object
  api.ChangePasswordReq:
    properties:
      old_password:
        type: string
      password:
        type: string
    type: object
  api.DeleteRecipientReq:
    properties:
      recipients:
        type: string
    type: object
  api.DeleteUserReq:
    properties:
      otp:
        type: string
    required:
    - otp
    type: object
  api.DomainReq:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  api.EmailReq:
    properties:
      email:
        type: string
      remember:
        type: boolean
    required:
    - email
    type: object
  api.ErrorRes:
    properties:
      error:
        type: string
    type: object
  api.PASessionReq:
    properties:
      id:
        type: string
      preauth_id:
        type: string
      token:
        type: string
    required:
    - id
    - preauth_id
    - token
    type: object
  api.RecipientReq:
    properties:
      id:
        type: string
      pgp_enabled:
        type: boolean
      pgp_inline:
        type: boolean
      pgp_key:
        type: string
    required:
    - id
    type: object
  api.ResetPasswordReq:
    properties:
      otp:
        type: string
      password:
        type: string
    required:
    - otp
    type: object
  api.RotatePASessionReq:
    properties:
      sessionid:
        type: string
    required:
    - sessionid
    type: object
  api.SettingsReq:
    properties:
      alias_format:
        type: string
      domain:
        type: string
      from_name:
        type: string
      id:
        type: string
      log_issues:
        type: boolean
      recipient:
        type: string
      remove_header:
        type: boolean
    required:
    - id
    type: object
  api.SignupEmailReq:
    properties:
      email:
        type: string
      subid:
        type: string
    required:
    - email
    - subid
    type: object
  api.SignupUserReq:
    properties:
      email:
        type: string
      password:
        type: string
      subid:
        type: string
    required:
    - email
    - subid
    type: object
  api.StepUpPasswordReq:
    properties:
      password:
        type: string
    type: object
  api.SubscriptionReq:
    properties:
      id:
        type: string
      subid:
        type: string
    required:
    - id
    type: object
  api.SuccessRes:
    properties:
      message:
        type: string
    type: object
  api.TotpReq:
    properties:
      otp:
        maxLength: 10
        minLength: 6
        type: string
    required:
    - otp
    type: object
  api.UpdateDomainReq:
    properties:
      catch_all:
        type: boolean
      create_alias:
        type: boolean
      description:
        type: string
      enabled:
        type: boolean
      from_name:
        type: string
      id:
        type: string
      recipient:
        type: string
    required:
    - id
    type: object
  api.UserReq:
    properties:
      email:
        type: string
      otp:
        maxLength: 10
        minLength: 0
        type: string
      password:
        type: string
      remember:
        type: boolean
    required:
    - email
    type: object
  model.AccessKey:
    properties:
      created_at:
        type: string
      expires_at:
        description: nullable
        type: string
      id:
        type: string
      name:
        type: string
      user_id:
        type: string
    type: object
  model.Alias:
    properties:
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      from_name:
        type: string
      id:
        type: string
      is_custom_domain:
        type: boolean
      is_domain_enabled:
        type: boolean
      is_domain_verified:
        type: boolean
      name:
        type: string
      origin:
        $ref: '#/definitions/model.AliasOrigin'
      pinned:
        type: boolean
      recipients:
        type: string
      stats:
        $ref: '#/definitions/model.AliasStats'
      wildcard:
        type: boolean
    type: object
  model.AliasList:
    properties:
      aliases:
        items:
          $ref: '#/definitions/model.Alias'
        type: array
      total:
        type: integer
    type: object
  model.AliasOrigin:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - Manual
    - Inbound
    - Import
  model.AliasStats:
    properties:
      blocks:
        type: integer
      forwards:
        type: integer
      replies:
        type: integer
      sends:
        type: integer
    type: object
  model.Credential:
    properties:
      created_at:
        type: string
      id:
        type: string
      user_id:
        type: string
    type: object
  model.DNSConfig:
    properties:
      dkim_selectors:
        items:
          type: string
        type: array
      domain:
        type: string
      mx_hosts:
        items:
          type: string
        type: array
      verify:
        type: string
    type: object
  model.Domain:
    properties:
      catch_all:
        type: boolean
      create_alias:
        type: boolean
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      from_name:
        type: string
      id:
        type: string
      mx_verified_at:
        description: nullable
        type: string
      name:
        type: string
      owner_verified_at:
        description: nullable
        type: string
      recipient:
        type: string
      send_verified_at:
        description: nullable
        type: string
    type: object
  model.Log:
    properties:
      attempted_at:
        type: string
      created_at:
        type: string
      destination:
        type: string
      from:
        type: string
      id:
        type: string
      log_type:
        $ref: '#/definitions/model.LogType'
      message:
        type: string
      remote_mta:
        type: string
      status:
        type: string
    type: object
  model.LogType:
    enum:
    - bounce
    - deferred_delivery
    - failed_delivery
    - disabled_alias
    - disabled_domain
    - unauthorised_send
    - inactive_subscription
    type: string
    x-enum-varnames:
    - BounceMessage
    - DeferredDelivery
    - FailedDelivery
    - DisabledAlias
    - DisabledDomain
    - UnauthorisedSend
    - InactiveSubscription
  model.Recipient:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      pgp_enabled:
        type: boolean
      pgp_inline:
        type: boolean
      pgp_key:
        type: string
    type: object
  model.Settings:
    properties:
      alias_format:
        type: string
      created_at:
        type: string
      domain:
        type: string
      from_name:
        type: string
      id:
        type: string
      log_issues:
        type: boolean
      recipient:
        type: string
      remove_header:
        type: boolean
    type: object
  model.Subscription:
    properties:
      active_until:
        type: string
      created_at:
        type: string
      id:
        type: string
      outage:
        type: boolean
      status:
        $ref: '#/definitions/model.SubscriptionStatus'
      terminated:
        type: boolean
      terminated_at:
        type: string
      tier:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  model.SubscriptionStatus:
    enum:
    - active
    - grace_period
    - limited_access
    - pending_delete
    type: string
    x-enum-varnames:
    - Active
    - GracePeriod
    - LimitedAccess
    - PendingDelete
  model.TOTPBackup:
    properties:
      backup:
        type: string
    type: object
  model.TOTPNew:
    properties:
      account:
        type: string
      secret:
        type: string
      uri:
        type: string
    type: object
  model.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      has_password:
        type: boolean
      id:
        type: string
      is_active:
        type: boolean
      totp_enabled:
        type: boolean
    type: object
  model.UserStats:
    properties:
      aliases:
        type: integer
      blocks:
        type: integer
      forwards:
        type: integer
      messages:
        items: {}
        type: array
      replies:
        type: integer
      sends:
        type: integer
    type: object
  model.WildcardDomainInfo:
    properties:
      count:
        type: integer
      delimiters_used:
        items:
          type: string
        type: array
      limit:
        type: integer
    type: object
info:
  contact: {}
paths:
  /accesskeys:
    get:
      consumes:
      - application/json
      description: Get all access keys for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AccessKey'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Get access keys
      tags:
      - access_key
    post:
      consumes:
      - application/json
      description: Create a new access key for the authenticated user
      parameters:
      - description: Access Key Request
        in: body
        name: access_key
        required: true
        schema:
          $ref: '#/definitions/api.AccessKeyReq'
      produces:
      - application/json
      responses:
        "200":
          description: token
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Create access key
      tags:
      - access_key
  /accesskeys/{id}:
    delete:
      consumes:
      - application/json
      description: Delete access key by ID
      parameters:
      - description: Access Key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Delete access key
      tags:
      - access_key
  /alias:
    post:
      consumes:
      - application/json
      description: Create alias
      parameters:
      - description: Alias request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AliasReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Create alias
      tags:
      - alias
  /alias/{id}:
    delete:
      consumes:
      - application/json
      description: Delete alias
      parameters:
      - description: Alias ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Delete alias
      tags:
      - alias
    get:
      consumes:
      - application/json
      description: Get alias by ID
      parameters:
      - description: Alias ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Alias'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Get alias
      tags:
      - alias
    put:
      consumes:
      - application/json
      description: Update alias
      parameters:
      - description: Alias ID
        in: path
        name: id
        required: true
        type: string
      - description: Alias request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AliasReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Update alias
      tags:
      - alias
  /alias/{id}/pin:
    put:
      consumes:
      - application/json
      description: Set alias pinned status; pinned aliases are always sorted first
        in the list
      parameters:
      - description: Alias ID
        in: path
        name: id
        required: true
        type: string
      - description: Pin request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AliasPinReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Pin or unpin alias
      tags:
      - alias
  /alias/forget/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently delete a custom-domain alias, bypassing the soft-delete
        step entirely
      parameters:
      - description: Alias ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Forget alias
      tags:
      - alias
  /alias/restore/{id}:
    post:
      consumes:
      - application/json
      description: Restore alias
      parameters:
      - description: Alias ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Restore alias
      tags:
      - alias
  /alias/wildcard-domain-info:
    get:
      consumes:
      - application/json
      description: Get how many Wildcard Aliases the user already has for a domain
        and which delimiters are used
      parameters:
      - description: Domain name or custom domain ID
        in: query
        name: domain
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.WildcardDomainInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Get Wildcard Alias domain info
      tags:
      - alias
  /aliases:
    get:
      consumes:
      - application/json
      description: Get all aliases
      parameters:
      - description: Filter by alias status
        enum:
        - active_inactive
        - active
        - inactive
        - deleted
        - all
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AliasList'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Get aliases
      tags:
      - alias
  /aliases/bulk/delete:
    post:
      consumes:
      - application/json
      description: Soft-delete multiple aliases at once; fails entirely if any selected
        alias is already deleted
      parameters:
      - description: Bulk delete request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.BulkAliasIDsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Bulk delete aliases
      tags:
      - alias
  /aliases/bulk/enable:
    post:
      consumes:
      - application/json
      description: Set enabled status for multiple aliases at once; deleted aliases
        and aliases left without a recipient are skipped
      parameters:
      - description: Bulk enable request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.BulkAliasEnabledReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Bulk activate/deactivate aliases
      tags:
      - alias
  /aliases/bulk/forget:
    post:
      consumes:
      - application/json
      description: Permanently delete multiple custom-domain aliases at once, bypassing
        the soft-delete step entirely; fails entirely if any selected alias isn't
        a custom domain alias
      parameters:
      - description: Bulk forget request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.BulkAliasIDsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Bulk forget aliases
      tags:
      - alias
  /aliases/bulk/pin:
    post:
      consumes:
      - application/json
      description: Set pinned status for multiple aliases at once; pinned aliases
        are always sorted first in the list, deleted aliases are skipped
      parameters:
      - description: Bulk pin request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.BulkAliasPinReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Bulk pin/unpin aliases
      tags:
      - alias
  /aliases/bulk/restore:
    post:
      consumes:
      - application/json
      description: Restore multiple soft-deleted aliases at once; fails entirely if
        any selected alias isn't deleted
      parameters:
      - description: Bulk restore request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.BulkAliasIDsReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Bulk restore aliases
      tags:
      - alias
  /aliases/export:
    get:
      consumes:
      - application/json
      description: Export all aliases as CSV
      produces:
      - text/csv
      responses:
        "200":
          description: CSV data
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Export aliases
      tags:
      - alias
  /announcements:
    get:
      description: Get list of announcements from the public announcements file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.Announcement'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.ErrorRes'
      summary: Get announcements
  /api/alias:
    post:
      consumes:
      - application/json
      description: Create alias
      parameters:
      - description: Alias request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AliasReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Create alias
      tags:
      - alias
  /api/alias/{id}:
    delete:
      consumes:
      - application/json
      description: Delete alias
      parameters:
      - description: Alias ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorRes'
      security:
      - ApiKeyAuth: []
      summary: Delete alias
      tags:
      - alias
    put:
      consumes:
      - application/json
      description: Update alias
      parameters:
      - description: Alias ID
        in: path
        name: id
        required: true
        type: string
      - description: Alias request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.AliasReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
