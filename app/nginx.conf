worker_processes 4;
# nginx-unprivileged: default /run/nginx.pid isn't writable by the non-root user
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 3001;
        root  /usr/share/nginx/html/app;
        include /etc/nginx/mime.types;

        # Headers
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "no-referrer";
        add_header Cross-Origin-Embedder-Policy "require-corp";
        add_header Cross-Origin-Opener-Policy "same-origin";
        add_header Cross-Origin-Resource-Policy "same-origin";
        add_header Origin-Agent-Cluster "?1";
        add_header Content-Security-Policy-Report-Only "default-src 'self'; connect-src 'self' https:; frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        server_tokens off;

        # Missing images/icons must 404 rather than fall back to index.html:
        # browsers (iOS Safari probes /apple-touch-icon*.png, /favicon.ico)
        # cache an HTML 200 as "no icon" for the site.
        location ~* \.(png|ico|svg|jpe?g|webp|gif)$ {
            try_files $uri =404;
        }

        location / {
            alias /usr/share/nginx/html/app/;
            try_files $uri $uri/ /index.html;
        }
    }
}