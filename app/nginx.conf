worker_processes 4;

events { worker_connections 1024; }

http {
    server {
        listen 3001;
        root  /usr/share/nginx/html/app;
        include /etc/nginx/mime.types;

        location / {
            alias /usr/share/nginx/html/app/;
            try_files $uri $uri/ /index.html;
        }
    }
}